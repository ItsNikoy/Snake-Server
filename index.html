<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Arcade Snake</title>
    <!-- Connect to Socket.io Client -->
    <script src="https://socket.io"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #183049 0%, #1e1e24 100%);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
        }
        #game-wrapper {
            background-color: #0c1624;
            border: 4px solid #1c2d42;
            border-radius: 8px;
            width: 100%;
            max-width: 950px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 2px solid #1c2d42;
            font-weight: bold;
            font-size: 16px;
        }
        #exit-btn {
            color: #a0aec0;
            cursor: pointer;
            user-select: none;
        }
        #score-display {
            color: #00ffcc;
            font-size: 18px;
            letter-spacing: 1px;
        }
        #high-score {
            color: #a0aec0;
        }
        #arena-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
        }
        canvas {
            width: 100%;
            height: 100%;
            background-color: #0c1624;
            display: block;
        }
        #connection-toast {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #ff9900;
            border: 1px solid #333;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Top Status Bar Interface -->
        <div id="top-bar">
            <div id="exit-btn">X Exit</div>
            <div id="score-display">SCORE: <span id="current-score">0</span></div>
            <div id="high-score">HI <span id="hi-val">0</span></div>
        </div>
        
        <!-- Big Multi-Food Arena -->
        <div id="arena-container">
            <canvas id="gameCanvas"></canvas>
            <div id="connection-toast">Connecting to server...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const toast = document.getElementById('connection-toast');
        const scoreDisplay = document.getElementById('current-score');
        const hiDisplay = document.getElementById('hi-val');

        // Layout Scaling Constants
        const GRID_COUNT_X = 64; 
        const GRID_COUNT_Y = 36; 
        let tileSize = 0;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            tileSize = canvas.width / GRID_COUNT_X;
        }
        window.addEventListener('resize', resizeCanvas);

        // Connect directly to your live Render server address
        const socket = io("https://onrender.com");

        let currentPlayers = {};
        let localSnake = {
            x: Math.floor(Math.random() * (GRID_COUNT_X - 10)) + 5,
            y: Math.floor(Math.random() * (GRID_COUNT_Y - 10)) + 5,
            dx: 0,
            dy: 0,
            score: 0,
            body: []
        };
        let tailLength = 5;

        // Massive Chaotic Food Spawns Array
        let foodArray = [];
        const TOTAL_FOOD_COUNT = 150; 

        function spawnInitialFood() {
            foodArray = [];
            for (let i = 0; i < TOTAL_FOOD_COUNT; i++) {
                foodArray.push({
                    x: Math.floor(Math.random() * GRID_COUNT_X),
                    y: Math.floor(Math.random() * GRID_COUNT_Y)
                });
            }
        }

        socket.on('connect', () => {
            toast.innerText = "CONNECTED TO LOBBY";
            toast.style.color = "#00ffcc";
            resizeCanvas();
            spawnInitialFood();
        });

        socket.on('disconnect', () => {
            toast.innerText = "DISCONNECTED";
            toast.style.color = "#ff0055";
        });

        socket.on('currentPlayers', (players) => { currentPlayers = players; });
        socket.on('newPlayer', (playerInfo) => { currentPlayers[playerInfo.id] = playerInfo; });
        socket.on('playerDisconnected', (id) => { delete currentPlayers[id]; });
        
        socket.on('playerMoved', (playerInfo) => {
            if (currentPlayers[playerInfo.id]) {
                currentPlayers[playerInfo.id].x = playerInfo.x;
                currentPlayers[playerInfo.id].y = playerInfo.y;
                currentPlayers[playerInfo.id].body = playerInfo.body || [];
            }
        });

        // Anti-Page Scrolling Lock + Direction Inputs
        window.addEventListener('keydown', (e) => {
            // Lock browser scroll for arrow keys
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            switch(e.key.toLowerCase()) {
                case 'arrowup': case 'w':
                    if (localSnake.dy === 0) { localSnake.dx = 0; localSnake.dy = -1; } break;
                case 'arrowdown': case 's':
                    if (localSnake.dy === 0) { localSnake.dx = 0; localSnake.dy = 1; } break;
                case 'arrowleft': case 'a':
                    if (localSnake.dx === 0) { localSnake.dx = -1; localSnake.dy = 0; } break;
                case 'arrowright': case 'd':
                    if (localSnake.dx === 0) { localSnake.dx = 1; localSnake.dy = 0; } break;
            }
        }, false);

        function gameLoop() {
            if (!tileSize) return;

            // Track snake segments history
            if (localSnake.dx !== 0 || localSnake.dy !== 0) {
                localSnake.body.push({x: localSnake.x, y: localSnake.y});
                while(localSnake.body.length > tailLength) {
                    localSnake.body.shift();
                }
            }

            localSnake.x += localSnake.dx;
            localSnake.y += localSnake.dy;

            // Edge mapping logic
            if (localSnake.x < 0) localSnake.x = GRID_COUNT_X - 1;
            if (localSnake.x >= GRID_COUNT_X) localSnake.x = 0;
            if (localSnake.y < 0) localSnake.y = GRID_COUNT_Y - 1;
            if (localSnake.y >= GRID_COUNT_Y) localSnake.y = 0;

            // Multi-food matrix collision mapping
            for (let i = 0; i < foodArray.length; i++) {
                if (localSnake.x === foodArray[i].x && localSnake.y === foodArray[i].y) {
                    localSnake.score += 10; // Exactly 10 points added
                    tailLength++; // Grow segment length
                    scoreDisplay.innerText = localSnake.score;
                    
                    if (localSnake.score > parseInt(hiDisplay.innerText)) {
                        hiDisplay.innerText = localSnake.score;
                    }

                    // Instant re-spawn coordinates switch
                    foodArray[i].x = Math.floor(Math.random() * GRID_COUNT_X);
                    foodArray[i].y = Math.floor(Math.random() * GRID_COUNT_Y);
                    break; 
                }
            }

            // Sync matrix positions directly to cloud server pipeline
            if (localSnake.dx !== 0 || localSnake.dy !== 0) {
                socket.emit('playerUpdate', { 
                    x: localSnake.x, 
                    y: localSnake.y, 
                    score: localSnake.score,
                    body: localSnake.body
                });
            }

            // Graphic render frames pipeline
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render Chaotic Food Pellets
            ctx.fillStyle = '#ff7675';
            foodArray.forEach(f => {
                ctx.beginPath();
                ctx.arc((f.x * tileSize) + (tileSize/2), (f.y * tileSize) + (tileSize/2), tileSize/3, 0, 2 * Math.PI);
                ctx.fill();
            });

            // Render Peer Elements (Other Snakes)
            Object.keys(currentPlayers).forEach((id) => {
                if (id !== socket.id) {
                    ctx.fillStyle = currentPlayers[id].color || '#fdcb6e';
                    const pBody = currentPlayers[id].body || [];
                    pBody.forEach(seg => {
                        ctx.fillRect(seg.x * tileSize + 1, seg.y * tileSize + 1, tileSize - 2, tileSize - 2);
                    });
                    ctx.fillRect(currentPlayers[id].x * tileSize + 1, currentPlayers[id].y * tileSize + 1, tileSize - 2, tileSize - 2);
                }
            });

            // Render Host Vector (Your Snake)
            ctx.fillStyle = '#00ffaa'; // Premium Neon Canva Green
            localSnake.body.forEach(seg => {
                ctx.fillRect(seg.x * tileSize + 1, seg.y * tileSize + 1, tileSize - 2, tileSize - 2);
            });
            ctx.fillRect(localSnake.x * tileSize + 1, localSnake.y * tileSize + 1, tileSize - 2, tileSize - 2);
        }

        setInterval(gameLoop, 90); // Blazing fast arcade tick interval speed (90ms)
    </script>
</body>
</html>
