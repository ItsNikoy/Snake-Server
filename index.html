<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Local Snake</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #183049 0%, #1e1e24 100%);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
        }
        #game-wrapper {
            background-color: #0c1624;
            border: 4px solid #1c2d42;
            border-radius: 8px;
            width: 100%;
            max-width: 950px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 2px solid #1c2d42;
            font-weight: bold;
            font-size: 16px;
        }
        #exit-btn {
            color: #a0aec0;
            cursor: pointer;
            user-select: none;
        }
        #score-display {
            color: #00ffcc;
            font-size: 18px;
            letter-spacing: 1px;
        }
        #high-score {
            color: #a0aec0;
        }
        #arena-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
        }
        canvas {
            width: 100%;
            height: 100%;
            background-color: #0c1624;
            display: block;
        }
        #game-over-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 22, 36, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0 0 4px 4px;
        }
        #game-over-screen h2 {
            color: #ff7675;
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #restart-btn {
            background: #1c2d42;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 10px 20px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        #restart-btn:hover {
            background: #00ffcc;
            color: #0c1624;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Top Status Bar Interface -->
        <div id="top-bar">
            <div id="exit-btn">X Exit</div>
            <div id="score-display">SCORE: <span id="current-score">0</span></div>
            <div id="high-score">HI <span id="hi-val">0</span></div>
        </div>
        
        <!-- Big Multi-Food Arena -->
        <div id="arena-container">
            <canvas id="gameCanvas"></canvas>
            
            <!-- End Game Overlay -->
            <div id="game-over-screen">
                <h2>GAME OVER</h2>
                <button id="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreDisplay = document.getElementById('current-score');
        const hiDisplay = document.getElementById('hi-val');

        const GRID_COUNT_X = 64; 
        const GRID_COUNT_Y = 36; 
        let tileSize = 0;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            tileSize = canvas.width / GRID_COUNT_X;
        }
        window.addEventListener('resize', resizeCanvas);

        // Single Player Configuration
        let localSnake = { x: 32, y: 18, dx: 0, dy: 0, score: 0, body: [], tail: 5, color: '#00ffaa' };

        let foodArray = [];
        const TOTAL_FOOD_COUNT = 150; 
        let isGameOver = false;

        function spawnFoodMatrix() {
            foodArray = [];
            for (let i = 0; i < TOTAL_FOOD_COUNT; i++) {
                foodArray.push({
                    x: Math.floor(Math.random() * GRID_COUNT_X),
                    y: Math.floor(Math.random() * GRID_COUNT_Y)
                });
            }
        }

        function resetGame() {
            isGameOver = false;
            gameOverScreen.style.display = 'none';
            
            localSnake = { x: 32, y: 18, dx: 0, dy: 0, score: 0, body: [], tail: 5, color: '#00ffaa' };
            scoreDisplay.innerText = "0";
            
            resizeCanvas();
            spawnFoodMatrix();
        }

        // Controls (WASD + Arrows both work)
        window.addEventListener('keydown', (e) => {
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault(); 
            }

            if (isGameOver) return;

            switch(e.key.toLowerCase()) {
                case 'arrowup':    case 'w': if (localSnake.dy === 0) { localSnake.dx = 0; localSnake.dy = -1; } break;
                case 'arrowdown':  case 's': if (localSnake.dy === 0) { localSnake.dx = 0; localSnake.dy = 1; } break;
                case 'arrowleft':  case 'a': if (localSnake.dx === 0) { localSnake.dx = -1; localSnake.dy = 0; } break;
                case 'arrowright': case 'd': if (localSnake.dx === 0) { localSnake.dx = 1; localSnake.dy = 0; } break;
            }
        }, false);

        function handleSnakeMovement() {
            if (localSnake.dx === 0 && localSnake.dy === 0) return;

            localSnake.body.push({x: localSnake.x, y: localSnake.y});
            while(localSnake.body.length > localSnake.tail) {
                localSnake.body.shift();
            }

            localSnake.x += localSnake.dx;
            localSnake.y += localSnake.dy;

            if (localSnake.x < 0) localSnake.x = GRID_COUNT_X - 1;
            if (localSnake.x >= GRID_COUNT_X) localSnake.x = 0;
            if (localSnake.y < 0) localSnake.y = GRID_COUNT_Y - 1;
            if (localSnake.y >= GRID_COUNT_Y) localSnake.y = 0;

            for (let i = 0; i < foodArray.length; i++) {
                if (localSnake.x === foodArray[i].x && localSnake.y === foodArray[i].y) {
                    localSnake.score += 10;
                    localSnake.tail++;
                    scoreDisplay.innerText = localSnake.score;
                    
                    if (localSnake.score > parseInt(hiDisplay.innerText)) {
                        hiDisplay.innerText = localSnake.score;
                    }

                    foodArray[i].x = Math.floor(Math.random() * GRID_COUNT_X);
                    foodArray[i].y = Math.floor(Math.random() * GRID_COUNT_Y);
                    break;
                }
            }

            localSnake.body.forEach(seg => {
                if (localSnake.x === seg.x && localSnake.y === seg.y) {
                    isGameOver = true;
                    gameOverScreen.style.display = 'flex';
                }
            });
        }

        function gameLoop() {
            if (!tileSize) resizeCanvas();
            if (isGameOver) return;

            handleSnakeMovement();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw all 150 food items
            ctx.fillStyle = '#ff7675';
            foodArray.forEach(f => {
                ctx.beginPath();
                ctx.arc((f.x * tileSize) + (tileSize/2), (f.y * tileSize) + (tileSize/2), tileSize/3, 0, 2 * Math.PI);
                ctx.fill();
            });

            // Draw Snake
            ctx.fillStyle = localSnake.color;
            localSnake.body.forEach(seg => {
                ctx.fillRect(seg.x * tileSize + 1, seg.y * tileSize + 1, tileSize - 2, tileSize - 2);
            });
            ctx.fillRect(localSnake.x * tileSize + 1, localSnake.y * tileSize + 1, tileSize - 2, tileSize - 2);
        }

        resetGame();
        setInterval(gameLoop, 90);
    </script>
</body>
</html>
